services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: backend-users-evaluation:latest
    container_name: backend-users-api
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      NODE_ENV: production
      PORT: 9090
      DATABASE_URL: "file:./data/prod.db"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-5242880}
    volumes:
      - db-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9090/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db-data:
